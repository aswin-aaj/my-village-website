<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Flower Gallery</title>

  <!-- LightGallery CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lightgallery@2.7.1/css/lightgallery-bundle.min.css">

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background: #f4f9f4;
    }

    h1 {
      text-align: center;
    }

    .gallery {
      column-count: 1;
      column-gap: 15px;
    }

    .item {
      break-inside: avoid;
      margin-bottom: 15px;
      background: white;
      border-radius: 10px;
      overflow: hidden;
      padding: 10px;
    }

    .item img {
      width: 100%;
      border-radius: 10px;
    }

    .info {
      margin-top: 8px;
      font-size: 14px;
    }

    @media (min-width: 600px) {
      .gallery { column-count: 2; }
    }

    @media (min-width: 900px) {
      .gallery { column-count: 3; }
    }
  </style>
</head>
<body>

<h1>🌸 My Flower Gallery</h1>

<div id="lightgallery" class="gallery">

  <!-- Item 1 -->
  <a href="flower/flower1.jpeg" class="item">
    <img src="flower/flower1.jpeg" alt="Flower 1">
    <div class="info">
      🌸 Hibiscus<br>
      📍 My Village<br>
      📅 2026-03-20
    </div>
  </a>

  <!-- Item 2 -->
  <a href="flower/flower2.jpg" class="item">
    <img src="flower/flower2.jpg" alt="Flower 2">
    <div class="info">
      🌼 Sunflower<br>
      📍 Garden<br>
      📅 2026-03-18
    </div>
  </a>

</div>

<!-- LightGallery JS -->
<script src="https://cdn.jsdelivr.net/npm/lightgallery@2.7.1/lightgallery.min.js"></script>

<script>
  lightGallery(document.getElementById('lightgallery'));
</script>

</body>
</html>
